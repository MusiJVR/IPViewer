name: '${name}'
prefix: '${prefix}'
description: '${description}'
version: '${version}'
authors: [ ${authors} ]

main: com.mousejava.ipviewer.IPViewer
api-version: '${apiVersion}'
folia-supported: true
load: POSTWORLD

libraries:
${libraries}

permissions:
  ipviewer.update_listener:
    description: Permission to receive update notifications
    default: op
  ipviewer.use:
    description: Permission to use commands
    default: op
  ipviewer.help:
    description: Permission to use command help
    default: op
  ipviewer.reload:
    description: Permission to use command reload
    default: op
  ipviewer.script:
    description: Permission to use command script
    default: op
  ipviewer.list:
    description: Permission to use command list
    default: op
