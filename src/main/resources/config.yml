database:
  type: 'sqlite' # Available types: sqlite, mysql
  ip: 'localhost'
  dbname: 'dbname'
  username: 'username'
  password: 'password'
  port: 3306
  properties: 'verifyServerCertificate=false&useSSL=false&useUnicode=true&characterEncoding=utf8'
  maximum_pool_size: 10
  connection_timeout_ms: 10000

# Path for the GeoIP script
script_geo_location: 'default.js'

# Notify players with 'advancedwaypoints.update_listener' permission about plugin updates
send_update_notifications: true

messages:
  new_version_available: "<b><color:#fbd300>IPViewer</color></b> <color:#c4b6a4>has been updated!</color>
  <br><color:#fbd300>New version:</color> <click:open_url:'<url>'><hover:show_text:'Visit Modrinth page'><b><color:#c4b6a4><new_version></color></b></hover></click>
  <br><color:#fbd300>Current version:</color> <b><color:#c4b6a4><current_version></color></b>
  "

  ipviewer:
    usage: "<color:#fbd300>Usage:</color> <color:#c4b6a4><hover:show_text:'Click to use /ipv'><click:suggest_command:'/ipv '>/ipv <action> [args]</click></hover></color>"

    reload:
      reload_successfully: '<color:#fbd300>Notification</color> <color:#c4b6a4>Plugin configuration successfully reloaded!</color>'

    script:
      usage: "<color:#fbd300>Usage:</color> <color:#c4b6a4><hover:show_text:'/ipv script'><click:suggest_command:'/ipv script '>/ipv script <action> [args]</click></hover></color>"
      generated: "<color:#fbd300>Notification</color> <color:#c4b6a4>Default script regenerated: <hover:show_text:'Click to copy path'><click:copy_to_clipboard:'scripts/default.js'>scripts/default.js</click></hover>. The selected script has not changed.</color>"
      selected: '<color:#fbd300>Notification</color> <color:#c4b6a4>GeoIP script set to <file>. Changes apply on the next player join.</color>'
      invalid_filename: '<color:#ff5555>Use a filename ending in .js, starting with a letter, digit, underscore or hyphen. Only Latin letters, digits, dots, underscores and hyphens are allowed; paths are not allowed.</color>'
      not_found: '<color:#ff5555>Script <file> was not found in the scripts folder.</color>'
      generate_failed: '<color:#ff5555>Could not generate the default GeoIP script. Check the server log.</color>'
      save_failed: '<color:#ff5555>Could not save the selected GeoIP script. Check the server log.</color>'

    list:
      usage: "<color:#fbd300>Usage:</color> <color:#c4b6a4><hover:show_text:'/ipv list'><click:suggest_command:'/ipv list '>/ipv list [filters]</click></hover></color>"
      error_loading_message: '<color:#ff5555>Error loading message templates</color>'
      correct_page_number: '<color:#fbd300>Please enter a valid page number (an integer greater than 0)</color>'
      invalid_time_format: '<color:#fbd300>Invalid time format entered (use integer and <s, m, h, d, w>)</color>'
      no_entries_on_page: '<color:#fbd300>There are no posts on this page</color>'
      list_player_template: "<color:#fbd300>List of players and IP:</color><players><br><color:#fbd300><hover:show_text:'Prev page'><click:run_command:'/ipv list <prev_page>'>◀</click></hover> Page <current>/<total> <hover:show_text:'Next page'><click:run_command:'/ipv list <next_page>'>▶</click></hover></color> <color:#c4b6a4>To view a page, type</color> <color:#fbd300><hover:show_text:'/ipv list'><click:suggest_command:'/ipv list '>/ipv list [filters]</click></hover></color>"
      player_ip_template: "<br><color:#4de1ff><page>.</color> <color:#fbd300><hover:show_text:'<time>'><click:copy_to_clipboard:'<time>'>⌚</click></hover></color> <color:#c4b6a4><hover:show_text:'Copy nickname'><player></hover>: <hover:show_text:'Copy IP'><ip></hover> (<hover:show_text:'Copy country name'><country></hover>, <hover:show_text:'Copy state/city name'><state></hover>)</color>"

    help: "<b><color:#c4b6a4>⏴-------</color><color:#fbd300>IPViewer</color><color:#c4b6a4>-------⏵</color></b>
    
    <color:#fbd300>Command:</color> <color:#c4b6a4><hover:show_text:'Click to use command'><click:suggest_command:'/ipv help'>/ipv help</click></hover></color>
      
    <color:#fbd300>Description:</color> <color:#c4b6a4>This command allows you to display all possible plugin commands</color>
    
    
    <color:#fbd300>Command:</color> <color:#c4b6a4><hover:show_text:'Click to use command'><click:suggest_command:'/ipv reload'>/ipv reload</click></hover></color>
      
    <color:#fbd300>Description:</color> <color:#c4b6a4>This command allows you to reload the plugin config</color>
    
    
    <color:#fbd300>Command:</color> <color:#c4b6a4><hover:show_text:'Click to use command'><click:suggest_command:'/ipv script '>/ipv script <action> [args]</click></hover></color>

    <color:#fbd300>Description:</color> <color:#c4b6a4>This command allows you to manage the GeoIP script</color>
    
    
    <color:#fbd300>Command:</color> <color:#c4b6a4><hover:show_text:'Click to use command'><click:suggest_command:'/ipv list '>/ipv list [filters]</click></hover></color>
      
    <color:#fbd300>Description:</color> <color:#c4b6a4>This command allows you to browse the list of players with optional filters</color>

    <b><color:#c4b6a4>⏴----------------------------⏵</color></b>
    "
